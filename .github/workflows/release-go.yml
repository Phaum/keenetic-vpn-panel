name: Release Go binaries

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goarch: amd64
            asset: amd64
          - goarch: arm64
            asset: arm64
          - goarch: arm
            goarm: "7"
            asset: armv7
          - goarch: mips
            gomips: softfloat
            asset: mips
          - goarch: mipsle
            gomips: softfloat
            asset: mipsle
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
      - name: Test
        if: matrix.goarch == 'amd64'
        working-directory: go
        run: go test ./...
      - name: Build
        working-directory: go
        env:
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
          GOMIPS: ${{ matrix.gomips }}
          CGO_ENABLED: "0"
        run: |
          output="keenetic-vpn-panel-linux-${{ matrix.asset }}"
          go build -trimpath -ldflags="-s -w -X main.panelVersion=${GITHUB_REF_NAME}" -o "../${output}" .
          cd ..
          sha256sum "${output}" > "${output}.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: keenetic-vpn-panel-${{ matrix.asset }}
          path: |
            keenetic-vpn-panel-linux-${{ matrix.asset }}
            keenetic-vpn-panel-linux-${{ matrix.asset }}.sha256
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: keenetic-vpn-panel-*
          merge-multiple: true
      - name: Package installer and source bundle
        run: |
          cp go/install/install.sh keenetic-vpn-panel-install.sh
          tar --transform='s,^,keenetic-vpn-panel-source/,' \
            -czf keenetic-vpn-panel-source.tar.gz go web assets
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            keenetic-vpn-panel-linux-*
            keenetic-vpn-panel-install.sh
            keenetic-vpn-panel-source.tar.gz
